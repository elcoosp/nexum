[package]
name = "nexum-floem"
description = "Floem adapter for nexum deep linking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["reactive", "floem", "ui", "state", "framework"]
categories.workspace = true
readme = "README.md"

[dependencies]
nexum-core = { path = "../nexum-core", version = "0.3.0" }
nexum-platform = { path = "../nexum-platform", version = "0.3.0" }
floem = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }

[features]
default = []
# Exposes `signal(config)`, bridging deep links into a Floem `ReadSignal`.
signal = ["dep:floem", "dep:crossbeam-channel"]

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
