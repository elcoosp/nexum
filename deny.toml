# cargo-deny configuration for the nexum workspace.
#
# Checked in CI by cargo-deny-action@v2.1.1 (see .github/workflows/security.yml).
# See https://embarkstudios.github.io/cargo-deny/

[graph]
# cargo-deny scans the whole workspace graph.
all-features = true

[licenses]
# The workspace is dual-licensed MIT OR Apache-2.0.
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0",
  "BSL-1.0",
  "NCSA",
  "CDLA-Permissive-2.0",
  "LicenseRef-OpenSSL",   # openssl-sys transitive (mac/windows keychain deps)
]
# Confidence threshold for license detection in LICENSE files.
confidence-threshold = 0.93

[bans]
# Lint level for when a crate listed here is encountered.
multiple-versions = "warn"
# Warn about wildcard dependency requirements in published crates.
wildcards = "deny"
# Workspace examples use path-only dependencies on unpublished local crates.
allow-wildcard-paths = true
deny = [
  # Webview glue must only be pulled in by the Dioxus desktop backend.
  { name = "wry", wrappers = ["dioxus-desktop"] },
]
skip = [
  # { name = "crate", version = "x.y" } — add known transitive duplicates here.
]
skip-tree = []

[sources]
# Only allow dependencies from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
# Vulnerability and notice advisories always fail; ignore specific IDs below
# if a transitive dependency cannot be upgraded.
# Unmaintained crates are ignored until replacements exist.
unmaintained = "none"
yanked = "deny"
ignore = [
  # quick-xml 0.38/0.39 are pinned transitively by zbus/wayland-scanner inside
  # GUI framework deps; no upgrade path to 0.41 is available yet.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is a transitive GUI-toolkit dependency; no fixed compatible release yet" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml is a transitive GUI-toolkit dependency; no fixed compatible release yet" },
]
