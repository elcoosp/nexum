[package]
name = "leptos-basic"
description = "Nexum Leptos deep-link example"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
nexum-leptos = { path = "../../nexum-leptos", features = ["signal"] }
leptos = { workspace = true, features = ["csr"] }

[package.metadata.bundle]
name = "Nexum Leptos Example"
identifier = "com.nexum.leptos-basic"
icon = ["icon.png"]
version = "0.1.0"
copyright = "MIT"
category = "public.app-category.developer-tools"
short_description = "Nexum Leptos Deep Link Example"
long_description = "Example application for Nexum deep linking in Leptos."
osx_url_schemes = ["nexumdemo"]

[workspace]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["elcoosp"]
repository = "https://github.com/elcoosp/nexum.git"
homepage = "https://github.com/elcoosp/nexum"
keywords = ["reactive", "signals", "ui", "state", "framework"]
categories = ["gui", "os"]

[workspace.dependencies]
leptos = { version = "0.9.0-rc1", default-features = false }

