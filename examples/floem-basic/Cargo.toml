[package]
name = "floem-basic"
description = "Nexum Floem deep-link example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
nexum-floem = { path = "../../nexum-floem", features = ["signal"] }
floem.workspace = true

[package.metadata.bundle]
name = "Nexum Floem Example"
identifier = "com.nexum.floem-basic"
icon = ["icon.png"]
version = "0.1.0"
copyright = "MIT"
category = "public.app-category.developer-tools"
short_description = "Nexum Floem Deep Link Example"
long_description = "Example application for Nexum deep linking in Floem."
osx_url_schemes = ["floem"]

[workspace]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["elcoosp"]
repository = "https://github.com/elcoosp/nexum.git"

[workspace.dependencies]
floem = "0.2.0"

