[package]
name = "dioxus-basic"
description = "Nexum Dioxus deep-link example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
nexum-dioxus = { path = "../../nexum-dioxus" }
dioxus.workspace = true

[package.metadata.bundle]
name = "Nexum Dioxus Example"
identifier = "com.nexum.dioxus-basic"
icon = ["icon.png"]
version = "0.1.0"
copyright = "MIT"
category = "public.app-category.developer-tools"
short_description = "Nexum Dioxus Deep Link Example"
long_description = "Example application for Nexum deep linking in Dioxus."
osx_url_schemes = ["dioxus"]

[workspace]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["elcoosp"]
repository = "https://github.com/elcoosp/nexum.git"

[workspace.dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }

