[package]
name = "nexum-core"
description = "Framework-agnostic deep-linking primitives for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["reactive", "signals", "ui", "state", "framework"]
categories.workspace = true
readme = "README.md"

[dependencies]
async-channel.workspace = true
url.workspace = true
thiserror.workspace = true
futures-core = { workspace = true, optional = true }

[features]
default = []
# Turns `DeepLinkHandle::into_stream` on (adds `futures-core`).
stream = ["dep:futures-core"]

[dev-dependencies]
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await", "executor"] }

[lints]
workspace = true
