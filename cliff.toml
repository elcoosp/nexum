# git-cliff configuration for the nexum workspace.
#
# Generates CHANGELOG.md from Conventional Commits. Crate scopes
# (`core:`, `platform:`, `floem:`, ...) are surfaced in the commit subject
# so multi-crate releases stay readable.
# See https://git-cliff.org/docs/configuration

[changelog]
# Template rendered once at the top of CHANGELOG.md.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
# Template rendered once per release section.
body = """
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% if previous and previous.tag %}\
    [compare](https://github.com/elcoosp/nexum/compare/{{ previous.tag }}...{{ version }})
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}\
    ### {{ group }}

    {% for commit in commits %}\
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}⚡ **BREAKING:** {% endif %}\
            {{ commit.message | upper_first | trim }}\
            {% if commit.remote.username %} (by @{{ commit.remote.username }}){% endif %}\
            ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/elcoosp/nexum/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}
"""
# Template rendered once at the bottom of CHANGELOG.md.
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespace from the rendered body.
trim = true

[git]
# Parse commits according to the Conventional Commits specification.
conventional_commits = true
# Exclude commits that do not parse as conventional commits.
filter_unconventional = false
# Protect breaking changes from being skipped by commit parsers.
protect_breaking_commits = true
# Process commits top-down (newest first) within a release.
topo_order = false
# Sort commits newest first within each section.
sort_commits = "newest"

# Assign groups and skip noise before the changelog body is rendered.
commit_preprocessors = [
  # Strip trailing "(#PR)" references — the commit link already points there.
  { pattern = "\\s*\\(#(\\d+)\\)$", replace = "" },
]

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "Continuous Integration" },
  { message = "^revert", group = "Reverted" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^build\\(deps", skip = true },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^build", group = "Build" },
  { message = ".*", group = "Other" },
]

# Only ship sections that contain commits.
filter_commits = true

# Semver tags without the `v` prefix.
tag_pattern = "[0-9].*"
# Sort tags by date, newest first.
sort_tags_by_date = true
# Never process tags older than the first public release.
ignore_tags = ""

# `#123` style references link to the GitHub issue tracker.
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/elcoosp/nexum/issues/$1" },
]

# GitHub remote used for compare/commit links.
[remote.github]
owner = "elcoosp"
repo = "nexum"
