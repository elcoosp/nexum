version: 2
updates:
  # Workspace root manifest — shared dependency versions.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Batch the monthly Rust ecosystem churn into reviewable PRs.
      rust-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # GitHub Actions used across the three workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
