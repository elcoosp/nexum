name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Changelog & GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the full history and all tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - name: Generate CHANGELOG.md
        run: git cliff --config-url https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/git-cliff/cliff.toml --output CHANGELOG.md
      - name: Extract the latest release notes
        id: notes
        run: |
          git cliff --config-url https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/git-cliff/cliff.toml --latest --strip all > release-notes.md
          {
            echo 'body<<EOF'
            cat release-notes.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: |
            CHANGELOG.md
            release-notes.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: false

  publish:
    name: Publish to crates.io
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      # Publish in dependency order; `--no-verify` avoids rebuilding the
      # heavy UI stacks for each member (the CI job already built them).
      - run: cargo publish -p nexum-core --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p nexum-platform --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p nexum-floem --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p nexum-xilem --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p nexum-dioxus --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p nexum-macros --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p nexum --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
