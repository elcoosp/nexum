name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validation only (no publish, no release)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: elcoosp/docs-toolkit/.github/workflows/rust-release.yml@main
    with:
      publish: true
      binary_targets: '[]'
      extra_checks: '["verify-tag","fmt","clippy","test"]'
      linux_deps: 'libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev'
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
