name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (pedantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      # The workspace lints table enables clippy::pedantic; `-D warnings`
      # turns every remaining warning into a hard failure. No
      # `#[allow]`/`#[expect]` suppressions exist anywhere in the code.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace --all-features

  coverage:
    name: Coverage (100% on core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: coverage
      # Hard gate: every line compiled on Linux for the logic crates is
      # covered. Adapter crates (xilem/dioxus) keep event-loop-bound glue
      # that cannot execute headlessly; see docs/COVERAGE.md.
      - name: Generate coverage and enforce the 100% gate
        run: |
          cargo llvm-cov --package nexum-core --package nexum-platform \
            --package nexum-floem --package nexum-leptos \
            --all-features --fail-under-lines 100 --lcov --output-path lcov-gate.info
      - name: Full workspace coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  msrv:
    name: MSRV (nexum-core / nexum-platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: msrv
      - run: cargo check -p nexum-core -p nexum-platform

  cross-target:
    name: Cross-target type check (${{ matrix.target }})
    # The cfg-gated backends (macOS NSBundle validator, Windows registry,
    # Android/iOS intake) never compile on the Linux test host; type-check
    # them on their real targets so typos cannot hide behind `#[cfg]`.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - x86_64-pc-windows-gnu
          - aarch64-linux-android
          - aarch64-apple-ios
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: cross-${{ matrix.target }}
      - run: cargo check -p nexum-core -p nexum-platform --all-features --target ${{ matrix.target }}

  wasm:
    name: Browser targets (wasm32)
    # nexum-core keeps its async transport usable on wasm so the Leptos
    # adapter and the leptos-basic example compile for the browser; the
    # blocking-only primitives are cfg-gated away there. Type-check the
    # whole path so the gating cannot rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: wasm
      - run: cargo check -p nexum-core -p nexum-leptos -p leptos-basic --all-features --target wasm32-unknown-unknown

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: docs
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
